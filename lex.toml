[package]
name        = "lex-pack-tradefinance"
version     = "0.1.0"
description = "Trade-finance domain pack (v0 scaffold) — electronic bill of lading title transfer under sole-control endorsement, plus letter-of-credit evidence-gated payment. Shares its custody data at the DATA level (the `events` table) with lex-pack-custody, not a code import."

[dependencies]
lex-soft   = { git = "https://github.com/alpibrusl/lex-soft" }
lex-trail  = { git = "https://github.com/alpibrusl/lex-trail" }
lex-web    = { git = "https://github.com/alpibrusl/lex-web" }
lex-schema = { git = "https://github.com/alpibrusl/lex-schema" }
lex-money  = { git = "https://github.com/alpibrusl/lex-money" }
